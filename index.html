<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#25164f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>For Someone Special ✨</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="loading">

    <div id="intro">
        <!-- Minimal sleek modern spinner icon -->
        <div class="minimalSpinner"></div>
    </div>

    <!-- Firebase SDK & Analytics Tracker -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getFirestore, doc, setDoc, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      // Your Firebase Config
      const firebaseConfig = {
        apiKey: "AIzaSyAu9S1dTo33ZXBXDFUxs0g5gCEURM-8Xgc",
        authDomain: "myspecialtracker.firebaseapp.com",
        projectId: "myspecialtracker",
        storageBucket: "myspecialtracker.firebasestorage.app",
        messagingSenderId: "257998904262",
        appId: "1:257998904262:web:917ab6343902192adab0c7"
      };

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // Session ID generator (#A8F3D2 format)
      function generateSessionId() {
        return 'Session #' + Math.random().toString(36).substring(2, 8).toUpperCase();
      }

      const sessionId = generateSessionId();
      const sessionStartTime = Date.now();

      // IP & Network Provider Fetcher (Jio, BSNL, Airtel, etc.)
      async function getNetworkDetails() {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 2500); // 2.5s max wait

          const res = await fetch("https://ipapi.co/json/", { signal: controller.signal });
          clearTimeout(timeoutId);

          if (res.ok) {
            const data = await res.json();
            return {
              ipAddress: data.ip || "Unknown",
              provider: data.org || data.asn || "Unknown ISP",
              city: data.city || "Unknown",
              region: data.region || "Unknown",
              country: data.country_name || "Unknown"
            };
          }
        } catch (e) {
          // Fallback if adblocker blocks API
        }
        return { ipAddress: "Hidden/AdBlocked", provider: "Unknown" };
      }

      // Global Tracker
      window.tracker = {
        sessionId: sessionId,
        startTime: sessionStartTime,
        firstClicked: null,
        networkDetails: null,

        async logEvent(eventName, extraData = {}) {
          try {
            const sessionRef = doc(db, "sessions", sessionId);
            const secondsSpent = Math.round((Date.now() - sessionStartTime) / 1000);
            
            const eventPayload = {
              event: eventName,
              timestamp: new Date().toISOString(),
              timeSpentSoFar: secondsSpent + "s",
              ...extraData
            };

            await setDoc(sessionRef, {
              sessionId: sessionId,
              lastUpdated: serverTimestamp(),
              events: arrayUnion(eventPayload),
              ...(window.tracker.networkDetails ? { network: window.tracker.networkDetails } : {})
            }, { merge: true });

          } catch (error) {
            console.error("Tracking Error:", error);
          }
        }
      };

      // Auto-log initial visit + IP details
      getNetworkDetails().then((netInfo) => {
        window.tracker.networkDetails = netInfo;
        window.tracker.logEvent("Website opened", {
          userAgent: navigator.userAgent,
          ...netInfo
        });
      });
    </script>

    <div id="stars"></div>
    <div id="romanticBg"></div>
    <div id="shootingStars"></div>
    <div id="floatingHearts"></div>
    <div id="backgroundQuotes"></div>
    <div id="heartExplosion"></div>
    <div id="confetti"></div>

    <div id="touchGlow"></div>
    <div id="touchRippleContainer"></div>

    <div id="popupContainer"></div>

    <main id="card">
        <div id="content"></div>
    </main>

    <script src="script.js"></script>

</body>
</html>
